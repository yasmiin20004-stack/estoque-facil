<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estoque Fácil</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f2f2f2;padding:15px}
h1{text-align:center;color:#1a7a4a}
.card{background:#fff;padding:15px;border-radius:12px;margin-bottom:15px;box-shadow:0 2px 8px #0001}
input,select{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:8px;font-size:16px}
button{width:100%;padding:13px;background:#1a7a4a;color:#fff;border:0;border-radius:8px;font-size:16px;font-weight:bold}
.item{background:#fff;padding:12px;border-radius:10px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.item b{font-size:17px}
.baixo{color:red;font-weight:bold}
.del{background:#ff4444;padding:8px 12px;width:auto}
</style>
</head>
<body>
<h1>📦 Estoque Fácil</h1>
<div class="card">
<input id="nome" placeholder="Nome do produto ex: Arroz">
<input id="qtd" type="number" placeholder="Quantidade">
<input id="preco" type="number" placeholder="Preço R$">
<button onclick="add()">+ ADICIONAR PRODUTO</button>
</div>
<input id="busca" placeholder="🔍 Pesquisar..." oninput="mostrar()">
<div id="lista"></div>
<script>
let dados=JSON.parse(localStorage.getItem('estoque')||'[]');
function add(){
let n=document.getElementById('nome').value;
let q=document.getElementById('qtd').value;
let p=document.getElementById('preco').value;
if(!n||!q){alert('Preencha nome e quantidade');return}
dados.push({n,q:Number(q),p:p||0});
localStorage.setItem('estoque',JSON.stringify(dados));
document.getElementById('nome').value='';document.getElementById('qtd').value='';document.getElementById('preco').value='';
mostrar();
}
function del(i){dados.splice(i,1);localStorage.setItem('estoque',JSON.stringify(dados));mostrar()}
function mostrar(){
let b=(document.getElementById('busca').value||'').toLowerCase();
let html='';
dados.forEach((x,i)=>{
if(!x.n.toLowerCase().includes(b))return;
html+=`<div class="item"><div><b>${x.n}</b><br>Qtd: <span class="${x.q<=2?'baixo':''}">${x.q}</span> - R$ ${x.p}</div><button class="del" onclick="del(${i})">X</button></div>`;
});
document.getElementById('lista').innerHTML=html||'<p style="text-align:center">Nenhum produto ainda</p>';
}
mostrar();
</script>
</body>
</html>
